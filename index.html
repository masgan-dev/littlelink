	<audio id="bg-music"></audio>

<script>
window.addEventListener('DOMContentLoaded', function() {
  // Daftar lagu (bebas ditambah)
  const playlist = [
    'song/1.mp3',
    'song/2.mp3',
    'song/3.mp3',
    'song/4.mp3',
    // Tambahkan lebih banyak lagu di sini, contoh:
    // 'song/DaniCalifornia.mp3',
    // 'song/Snow.mp3'
  ];

  let currentTrack = 0;
  const audio = document.getElementById('bg-music');
  audio.src = playlist[currentTrack];

  function playMusic() {
    audio.play().catch(function(){});
  }

  // Play otomatis (bandel ke autoplay policy jika browser mengizinkan)
  playMusic();

  // Trig jika interaksi (semua event yang pernah kita pasang sebelumnya!)
  window.addEventListener('click', playMusic, { once: true });
  window.addEventListener('scroll', playMusic, { once: true });
  window.addEventListener('touchstart', playMusic, { once: true });
  window.addEventListener('touchmove', playMusic, { once: true });
  window.addEventListener('pointerdown', playMusic, { once: true });
  window.addEventListener('keydown', playMusic, { once: true });
  window.addEventListener('wheel', playMusic, { once: true });

  // Event saat lagu selesai: mainkan lagu selanjutnya, lalu loop playlist balik ke awal
  audio.addEventListener('ended', function() {
    currentTrack++;
    if (currentTrack >= playlist.length) currentTrack = 0; // loop ke awal
    audio.src = playlist[currentTrack];
    audio.play().catch(function(){});
  });
});
</script>
